repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: pixi run --frozen ruff check --fix
        language: system
        files: ^(src|tests|tools)/.*\.py$
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: pixi run --frozen ruff format
        language: system
        files: ^(src|tests|tools)/.*\.py$
        require_serial: true
      - id: pyright
        name: pyright
        entry: pixi run --frozen pyright
        language: system
        files: ^(src|tests|tools)/.*\.py$
        pass_filenames: false
        require_serial: true
