[project]
authors = [{ name = "Sanggeun Park", email = "psk6950@snu.ac.kr" }]
name = "foldforge"
description = "One environment for many structure predictors, built on team-gm"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
  "team-gm",
  "biomol>=1.0,<2",
  "lmdb>=1.7,<2",
  "biopython>=1.85,<2",
  # Imported directly by model configs; team-gm pulls it transitively, but a
  # direct import earns a direct declaration.
  "pydantic>=2,<3",
  "safetensors>=0.4,<1",
  "transformers==4.57.6",
  "esm==3.3.0",
  "foldforge-af3-data",
  "ml-collections==1.1.0",
  "optree==0.17.0",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "biotite>=1.4,<2",
  "rdkit>=2025,<2027",
  "scikit-learn>=1.7,<2",
  "pandas>=2.3,<3",
  "networkx>=3,<4",
  "zstandard>=0.23,<1",
  "tqdm>=4.67,<5",
  "pyyaml>=6,<7",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
# Mutually exclusive CUDA backends, mirroring team-gm's — pick exactly one:
#   uv sync --extra cu12   (torch from the pytorch-cu128 index)
#   uv sync --extra cu13   (torch from the pytorch-cu130 index)
# Forward CUDA selection to team-gm, which owns the torch version bounds and
# CUDA indexes. Repeating those indexes here creates conflicting source rules.
cu12 = ["team-gm[cu12]"]
cu13 = ["team-gm[cu13]"]
# Ampere/Ada (A100, A5000, A6000): select together with cu12.
flash2 = ["flash-attn==2.8.3.post1"]

[project.scripts]
foldforge = "foldforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldforge"]

[tool.uv]
# Replace esm's mutable Transformers @main requirement with the source pin below.
override-dependencies = ["transformers==4.57.6"]
# Keep the engine-tested CuTe/Quack pair across every optional environment.
constraint-dependencies = ["quack-kernels==0.5.0", "nvidia-cutlass-dsl==4.5.2"]
conflicts = [
  [{ extra = "cu12" }, { extra = "cu13" }],
  [{ package = "team-gm", extra = "cu12" }, { package = "team-gm", extra = "cu13" }],
]

[tool.uv.workspace]
members = ["libs/team-gm"]

[tool.uv.sources]
foldforge-af3-data = { path = "libs/af3-data" }
# Match the reference ESMFold2 input processor.
esm = { git = "https://github.com/Biohub/esm.git", rev = "fba1e42a8a0f8df2b7e08611c88807aa32a25d9c" }
# ESMFold2/ESMC checkpoint APIs come from the Biohub fork, not PyPI.
transformers = { git = "https://github.com/Biohub/transformers.git", rev = "b435f1f92dd5b4a653be57157d4f4f5ddba4f145" }
team-gm = { workspace = true }
# The workspace uses this root engine source. Keep the same revision in
# libs/team-gm/pyproject.toml for its standalone installs.
miniworld-engine = { git = "ssh://git@github.com/SanggeunParrk/miniworld-engine.git", rev = "d2266a035de11384c46f8cc980e6460f60925413" }

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pre-commit>=4.6,<5",
  "ruff>=0.15,<0.16",
  "pyright[nodejs]==1.1.408",
  "pandas-stubs==2.3.3.260113",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["libs", "validation", "runs", "model_checkpoints"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E731",
  "E741",
  "F722",    # Incompatible with jaxtyping
  "S311",
  "D105",
  "D100",
  "D107",
  "D203",
  "D213",
  "PLR0913",
  "ANN401",
  "PLR0402",
  "N812",
  "NPY002",
  "COM812",  # Conflicts with ruff formatter
]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
# Optional dependency fixtures/importorskip must run before backend imports.
"tests/*" = ["D", "ANN201", "S101", "INP001", "ANN001", "PLR2004", "E402", "PLC0415"]
"scripts/*" = [
  "D",
  "ANN201",
  "S101",
  "INP001",
  "FBT001",
  "PLC0415",
  "C901",
  "PLR0915", # Too many statements
]

# Paper-notation numerical code: the same exceptions as team-gm diffusion/SE(3),
# with every file still checked. Chemical graph permutations, geometric crop
# selection and tensor transforms follow the same policy.
"src/foldforge/{modules,eval}/**" = ["N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504"]
"src/foldforge/training/{loss,shape_complementarity}.py" = ["N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504"]
"src/foldforge/utils/{geometry,dense_geometry,tensor}.py" = ["N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504"]
"src/foldforge/data/cropping.py" = ["N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504"]
"src/foldforge/data/ccd/substructure_perms.py" = ["N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504"]
"src/foldforge/data/features/{featurizer,geometry,permutations,constraints,dense_protein}.py" = ["N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504"]

# Ordered chemistry/MSA algorithms follow team-gm's numerical complexity policy.
# Keep their stages together for reference comparison; type, import, error,
# security and correctness checks remain enabled throughout these files.
"src/foldforge/data/{parser,filter}.py" = ["C901", "PLR0912", "PLR0915", "PLR2004"]
"src/foldforge/data/features/atoms.py" = ["C901", "PLR0912", "PLR0915", "PLR2004"]
"src/foldforge/data/msa/featurizer.py" = ["C901", "PLR0912", "PLR0915", "PLR2004"]
"src/foldforge/data/inputs/{entities,features,serialize,prepare_sequence}.py" = ["C901", "PLR0912", "PLR0915", "PLR2004"]
"src/foldforge/data/template/{features,featurizer,parser}.py" = ["C901", "PLR0912", "PLR0915", "PLR2004"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.pyright]
include = ["src/foldforge"]
exclude = ["libs", "validation", "runs"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

# Compile FA2 against the selected CUDA Torch build, including its ABI.
[tool.uv.extra-build-dependencies]
flash-attn = [
  { requirement = "torch", match-runtime = true },
  "packaging", "ninja", "psutil", "wheel",
]
