[project]
authors = [{ name = "Sanggeun Park", email = "psk6950@snu.ac.kr" }]
name = "foldforge"
description = "One environment for many structure predictors, built on team-gm"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
  "team-gm",
  "biomol>=1.0,<2",
  "lmdb>=1.7,<2",
  "biopython>=1.85,<2",
  # Imported directly by model configs; team-gm pulls it transitively, but a
  # direct import earns a direct declaration.
  "pydantic>=2,<3",
  "safetensors>=0.4,<1",
  "transformers==4.57.6",
  "esm==3.3.0",
  "foldforge-af3-data",
  "ml-collections==1.1.0",
  "optree==0.17.0",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "biotite>=1.4,<2",
  "rdkit>=2025,<2027",
  "scikit-learn>=1.7,<2",
  "pandas>=2.3,<3",
  "networkx>=3,<4",
  "zstandard>=0.23,<1",
  "tqdm>=4.67,<5",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Mutually exclusive CUDA backends, mirroring team-gm's — pick exactly one:
#   uv sync --extra cu12   (torch from the pytorch-cu128 index)
#   uv sync --extra cu13   (torch from the pytorch-cu130 index)
# Forward CUDA selection to team-gm, which owns the torch version bounds and
# CUDA indexes. Repeating those indexes here creates conflicting source rules.
cu12 = ["team-gm[cu12]"]
cu13 = ["team-gm[cu13]"]
# Ampere/Ada (A100, A5000, A6000): select together with cu12.
flash2 = ["flash-attn==2.8.3.post1"]

[project.scripts]
foldforge = "foldforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldforge"]

[tool.uv]
# Replace esm's mutable Transformers @main requirement with the source pin below.
override-dependencies = ["transformers==4.57.6"]
# Keep the engine-tested CuTe/Quack pair across every optional environment.
constraint-dependencies = ["quack-kernels==0.5.0", "nvidia-cutlass-dsl==4.5.2"]
conflicts = [
  [{ extra = "cu12" }, { extra = "cu13" }],
  [{ package = "team-gm", extra = "cu12" }, { package = "team-gm", extra = "cu13" }],
]

[tool.uv.workspace]
members = ["libs/team-gm"]

[tool.uv.sources]
foldforge-af3-data = { path = "libs/af3-data" }
# Match the reference ESMFold2 input processor.
esm = { git = "https://github.com/Biohub/esm.git", rev = "fba1e42a8a0f8df2b7e08611c88807aa32a25d9c" }
# ESMFold2/ESMC checkpoint APIs come from the Biohub fork, not PyPI.
transformers = { git = "https://github.com/Biohub/transformers.git", rev = "b435f1f92dd5b4a653be57157d4f4f5ddba4f145" }
team-gm = { workspace = true }
# The workspace uses this root engine source. Keep the same revision in
# libs/team-gm/pyproject.toml for its standalone installs.
miniworld-engine = { git = "ssh://git@github.com/SanggeunParrk/miniworld-engine.git", rev = "d2266a035de11384c46f8cc980e6460f60925413" }

[dependency-groups]
dev = [
  "matplotlib>=3.10,<4",
  "pandas>=2.3,<3",
  "pytest>=8.3,<9",
  "ruff>=0.15,<0.16",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# The vendored framework lints under its own rules, not FoldForge's.
# Preserve the style of pinned upstream model sources.
extend-exclude = ["libs", "**/ported/**", "src/foldforge/models/esmfold2/input", "src/foldforge/data/ccd/components.py", "src/foldforge/data/ccd/esm_view.py", "src/foldforge/data/ccd/substructure_perms.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E731",
  "E741",
  "F722",   # Incompatible with jaxtyping
  "S311",
  "D105",
  "D100",
  "D107",
  "D203",
  "D213",
  "PLR0913",
  "ANN401",
  "PLR0402",
  "N812",
  "NPY002",
  "COM812", # Conflicts with ruff formatter
]

[tool.ruff.format]
# Same reason as the per-file lint ignores below: reformatting an adapted block
# would make it stop diffing cleanly against the copy it came from.
exclude = ["src/foldforge/models/esmfold2/atom_transformer.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN201", "S101", "INP001", "ANN001", "PLR2004"]
# Blocks adapted from team-gm rather than written here. Kept diff-clean against
# their origin so they stay comparable with the sibling copies other terminal
# repos hold — reformatting them to FoldForge's taste would cost that for
# nothing. TC001/TC002 are ignored on purpose and not merely for convenience:
# jaxtyping's Float/Int must stay importable at runtime, or beartype cannot
# enforce shapes under SHOULD_TYPECHECK=true.
"src/foldforge/models/esmfold2/atom_transformer.py" = [
  "D102",
  "D205",
  "E501",
  "RET504",
  "TC001",
  "TC002",
]
"scripts/*" = [
  "D",
  "ANN201",
  "S101",
  "INP001",
  "FBT001",
  "PLC0415",
  "C901",
  "PLR0915",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["src/foldforge"]
exclude = ["libs"]

# Compile FA2 against the selected CUDA Torch build, including its ABI.
[tool.uv.extra-build-dependencies]
flash-attn = [
  { requirement = "torch", match-runtime = true },
  "packaging", "ninja", "psutil", "wheel",
]
