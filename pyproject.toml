[project]
authors = [{ name = "Sanggeun Park", email = "psk6950@snu.ac.kr" }]
name = "foldforge"
description = "One environment for many structure predictors, built on miniworld-engine"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
  "torch==2.13.0",
  "einops>=0.8,<1",
  "jaxtyping>=0.3,<1",
  "beartype>=0.21,<1",
  "safetensors>=0.4,<1",
  "ninja>=1.13,<2",
  "cuequivariance-torch>=0.12,<0.13",
  "biomol>=1.0,<2",
  "lmdb>=1.7,<2",
  "biopython>=1.85,<2",
  "pydantic>=2,<3",
  "transformers==4.57.6",
  "esm==3.3.0",
  "foldforge-af3-data",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "biotite>=1.4,<2",
  "rdkit>=2025,<2027",
  "pandas>=2.3,<3",
  "zstandard>=0.23,<1",
  "pyyaml>=6,<7",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
# Ampere/Ada (A100, A5000, A6000): FlashAttention-2 compiles against the installed torch.
flash2 = ["flash-attn==2.8.3.post1"]

[project.scripts]
foldforge = "foldforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldforge"]

# One pixi project, the same layout as MiniWorld and miniworld-engine. `cu12` is torch 2.13.0+cu129
# (the newest CUDA the cluster drivers run); `cu13` is the CUDA 13 build.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.cuda129.system-requirements]
cuda = "12.9"

[tool.pixi.feature.cuda129.pypi-dependencies]
cuequivariance-ops-torch-cu12 = "==0.12.*"
# FlashAttention-4 (CuTeDSL), pinned to what miniworld-engine unpacks.
flash-attn-4 = { version = "==4.0.0b32", extras = ["cu12"] }

[tool.pixi.feature.cuda129.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu129"]

[tool.pixi.feature.cuda13.system-requirements]
cuda = "13"

[tool.pixi.feature.cuda13.pypi-dependencies]
cuequivariance-ops-torch-cu13 = "==0.12.*"

[tool.pixi.feature.cuda13.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu130"]

[tool.pixi.environments]
default = { features = ["cuda129"] }
cu13 = { features = ["cuda13"] }

[tool.pixi.dependencies]
python = "~=3.12.0"
pytest = ">=8.3,<9"
ruff = ">=0.15,<0.16"
pre-commit = ">=4.6,<5"
nodejs = "*"

[tool.pixi.pypi-options]
# esm asks for a git Transformers; the release it was built on comes from PyPI.
dependency-overrides = { transformers = "==4.57.6" }
# The torch index also carries (older) cmake/ninja; pick the best version across indexes.
index-strategy = "unsafe-best-match"

[tool.pixi.pypi-dependencies]
foldforge = { path = ".", editable = true }
foldforge-af3-data = { path = "third_party/af3-data" }
# Match the reference ESMFold2 input processor.
esm = { git = "https://github.com/Biohub/esm.git", rev = "fba1e42a8a0f8df2b7e08611c88807aa32a25d9c" }
# The engine release on PyPI: its wheel ships the H100 (sm_90) kernels prebuilt for CUDA 12.9 and 13.0.
miniworld-engine = "==2.3.8"


[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["third_party", "tools/typings", "src/foldforge/modules/esmc"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E731",
  "E741",
  "F722",    # Incompatible with jaxtyping
  "S311",
  "D105",
  "D100",
  "D107",
  "D203",
  "D213",
  "PLR0913",
  "ANN401",
  "PLR0402",
  "N812",
  "NPY002",
  "COM812",  # Conflicts with ruff formatter
]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
# Optional dependency fixtures/importorskip must run before backend imports.
"tests/*" = ["D", "ANN201", "S101", "INP001", "ANN001", "PLR2004", "E402", "PLC0415"]
"tools/*" = [
  "D",
  "ANN201",
  "S101",
  "INP001",
  "FBT001",
  "PLC0415",
  "C901",
  "PLR0915", # Too many statements
]

# Paper-notation numerical code, the gather/geometry tables and the compile/graph glue:
# single-letter names, untyped tensor helpers and long equations are idiomatic there.
# Every file is still checked for imports, correctness and security.
"src/foldforge/{modules,eval,guidance}/**" = ["E402", "PLC0414", "PLC0415", "RUF009", "S101", "B023", "SLF001", "A002", "ARG002", "SIM102", "B008", "BLE001", "E721", "N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504", "TRY003", "TRY004", "EM101", "EM102", "B905", "RUF005", "RUF013", "UP035", "B006", "C408", "SIM108", "RUF059", "TC003", "FURB171", "RUF046", "SIM201", "T201"]
"src/foldforge/utils/{atom_layout,dense_geometry}.py" = ["E402", "PLC0414", "PLC0415", "RUF009", "S101", "B023", "SLF001", "A002", "ARG002", "SIM102", "B008", "BLE001", "E721", "N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504", "TRY003", "TRY004", "EM101", "EM102", "B905", "RUF005", "RUF013", "UP035", "B006", "C408", "SIM108", "RUF059", "TC003", "FURB171", "RUF046", "SIM201", "T201"]
"src/foldforge/data/features/dense_protein.py" = ["E402", "PLC0414", "PLC0415", "RUF009", "S101", "B023", "SLF001", "A002", "ARG002", "SIM102", "B008", "BLE001", "E721", "N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504", "TRY003", "TRY004", "EM101", "EM102", "B905", "RUF005", "RUF013", "UP035", "B006", "C408", "SIM108", "RUF059", "TC003", "FURB171", "RUF046", "SIM201", "T201"]
"src/foldforge/models/execution.py" = ["E402", "PLC0414", "PLC0415", "RUF009", "S101", "B023", "SLF001", "A002", "ARG002", "SIM102", "B008", "BLE001", "E721", "N802", "N803", "N806", "ANN", "ARG001", "D", "E501", "PLR2004", "PLR0912", "C901", "TC001", "TC002", "FBT001", "FBT002", "ERA001", "RET504", "TRY003", "TRY004", "EM101", "EM102", "B905", "RUF005", "RUF013", "UP035", "B006", "C408", "SIM108", "RUF059", "TC003", "FURB171", "RUF046", "SIM201", "T201"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.pyright]
include = ["src/foldforge"]
exclude = ["third_party"]
stubPath = "tools/typings"
venvPath = ".pixi/envs"
venv = "default"
pythonVersion = "3.12"
typeCheckingMode = "standard"

