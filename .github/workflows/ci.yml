# Lint and CPU tests on every push and pull request.
#
# GPU tests (about 180 of them skip here) and the release-reference validation
# need a GPU and run on the cluster:
#   pixi run pytest tests                    (on a GPU node: the full suite)
#   tools/references/validate.sh fast        (fold vs tests/release_references/, then
#   foldforge validate $FOLDFORGE_HOME/runs/validate-fast)
# The test job needs read access to the private miniworld-engine repository:
# add a deploy key that can read it as the repository secret
# FOLDFORGE_CI_SSH_KEY. Without it the job is skipped, not failed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          run-install: false
      - name: ruff check
        run: pixi exec ruff@0.15 check src tests tools
      - name: ruff format
        run: pixi exec ruff@0.15 format --check src tests tools

  test-cpu:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FOLDFORGE_CI_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.HAS_KEY == 'true'
        with:
          ssh-private-key: ${{ secrets.FOLDFORGE_CI_SSH_KEY }}
      - uses: prefix-dev/setup-pixi@v0.8.14
        if: env.HAS_KEY == 'true'
        with:
          locked: true
      - name: pytest (CPU; GPU tests skip)
        if: env.HAS_KEY == 'true'
        run: pixi run pytest tests -q -rs
